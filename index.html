<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>AR名刺</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  :root{
    --ink:#12181f;
    --paper:#f4efe6;
    --gold:#c9a15a;
    --gold-bright:#f0cf8a;
    --teal:#1f4d4a;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;}

  a-scene{width:100vw;height:100vh;}

  /* AR.js が挿入する video / canvas を確実に画面いっぱいに表示する */
  #arjs-video,
  a-scene video,
  a-scene canvas{
    position:fixed !important;
    top:0 !important;
    left:0 !important;
    width:100vw !important;
    height:100vh !important;
    object-fit:cover !important;
    z-index:1 !important;
  }

  /* ---- top instruction bar ---- */
  #hint{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px 18px calc(14px + env(safe-area-inset-top)) 18px;
    background:linear-gradient(180deg, rgba(18,24,31,.92), rgba(18,24,31,0));
    color:var(--paper);
    text-align:center;
    pointer-events:none;
    transition:opacity .6s ease;
  }
  #hint .dot{
    width:8px;height:8px;border-radius:50%;background:var(--gold-bright);
    box-shadow:0 0 8px var(--gold-bright);
    animation:pulse 1.4s infinite ease-in-out;
    flex-shrink:0;
  }
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  #hint p{margin:0;font-size:14px;letter-spacing:.02em;line-height:1.5;}
  #hint p b{color:var(--gold-bright);font-weight:600;}
  #hint.hide{opacity:0;}

  /* ---- found badge ---- */
  #found{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    z-index:20;
    background:rgba(18,24,31,.85);
    color:var(--gold-bright);
    border:1px solid rgba(240,207,138,.4);
    padding:9px 20px;border-radius:999px;
    font-size:13px;letter-spacing:.08em;
    opacity:0;transition:opacity .4s ease, transform .4s ease;
    pointer-events:none;
  }
  #found.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- loading screen ---- */
  #loader{
    position:fixed;inset:0;z-index:30;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    color:var(--paper);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #loader.hide{opacity:0;visibility:hidden;}
  #loader .ring{
    width:46px;height:46px;border-radius:50%;
    border:2px solid rgba(240,207,138,.2);
    border-top-color:var(--gold-bright);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{font-size:13px;letter-spacing:.12em;color:#b9c2cc;}

  /* ---- unsupported message ---- */
  #unsupported{
    position:fixed;inset:0;z-index:40;background:var(--ink);color:var(--paper);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:12px;
  }
  #unsupported h1{font-size:17px;margin:0;color:var(--gold-bright);font-weight:600;}
  #unsupported p{font-size:14px;line-height:1.7;color:#c9d0d8;max-width:320px;margin:0;}
</style>
</head>
<body>

<div id="loader">
  <div class="ring"></div>
  <p>カメラを起動しています</p>
</div>

<div id="unsupported">
  <h1>カメラを利用できません</h1>
  <p>このページはカメラへのアクセスが必要です。https:// で始まるURLで、Safari / Chrome の最新版から開いてください。プライベートブラウズモードでは動作しないことがあります。</p>
</div>

<div id="hint">
  <span class="dot"></span>
  <p><b>名刺</b> にスマホのカメラをかざしてください</p>
</div>

<div id="found">MARKER DETECTED — 表示中</div>

<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: mediump; alpha: true"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
>

  <a-assets>
    <a-mixin id="pulse-in"
      animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; easing: easeOutBack; startEvents: markerFound"
      animation__out="property: scale; to: 0 0 0; dur: 250; easing: easeInQuad; startEvents: markerLost"
    ></a-mixin>
  </a-assets>

  <!--
    プレースホルダーとして標準の Hiro マーカーを使用しています。
    実際の名刺デザインをマーカーにする場合は、以下のジェネレーターで
    名刺の画像から .patt ファイルを作成し、下の preset="hiro" を
    type="pattern" url="あなたのファイル.patt" に差し替えてください。
    https://ar-js-org.github.io/AR.js/three.js/examples/marker-training/examples/generator.html
  -->
  <a-marker preset="hiro" id="marker" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

    <a-entity mixin="pulse-in" position="0 0.3 0">

      <!-- rotating core: stylised logo made of a torus-knot + halo ring -->
      <a-entity id="logo-spin"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">

        <a-torus-knot
          radius="0.32" radius-tubular="0.045" p="2" q="3"
          color="#c9a15a"
          material="metalness:0.75; roughness:0.25; emissive:#3a2a10; emissiveIntensity:0.25"
          position="0 0 0">
          <a-animation attribute="position" dur="2200" direction="alternate"
            easing="easeInOutSine" repeat="indefinite" to="0 0.06 0"></a-animation>
        </a-torus-knot>

        <a-torus
          radius="0.55" radius-tubular="0.006"
          color="#f0cf8a" opacity="0.55" rotation="90 0 0"
          material="shader: flat; transparent:true"></a-torus>

        <a-torus
          radius="0.68" radius-tubular="0.004"
          color="#f0cf8a" opacity="0.3" rotation="90 0 0"
          material="shader: flat; transparent:true">
          <a-animation attribute="rotation" dur="9000" easing="linear" repeat="indefinite"
            to="90 360 0"></a-animation>
        </a-torus>
      </a-entity>

      <!-- soft ground shadow disc -->
      <a-circle radius="0.62" rotation="-90 0 0" position="0 -0.18 0"
        color="#000000" opacity="0.18" material="shader: flat; transparent:true"></a-circle>

      <!-- name / role plate, floating just below the logo -->
      <a-entity position="0 -0.42 0">
        <a-plane width="1.15" height="0.34" color="#12181f" opacity="0.82"
          material="shader:flat; transparent:true" radius="0.02"></a-plane>
        <a-text value="YOUR NAME" align="center" color="#f0cf8a"
          width="1.4" position="0 0.055 0.01" font="mozillavr"
          letter-spacing="1"></a-text>
        <a-text value="Job Title / Company" align="center" color="#d8cdb6"
          width="1.05" position="0 -0.06 0.01" font="mozillavr"></a-text>
      </a-entity>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const loader = document.getElementById('loader');
  const hint = document.getElementById('hint');
  const found = document.getElementById('found');
  const unsupported = document.getElementById('unsupported');
  const scene = document.querySelector('a-scene');

  // secure-context / getUserMedia check
  if (!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    unsupported.style.display = 'flex';
    loader.classList.add('hide');
  }

  scene.addEventListener('loaded', () => {
    setTimeout(() => loader.classList.add('hide'), 500);
  });

  const marker = document.getElementById('marker');
  marker.addEventListener('markerFound', () => {
    hint.classList.add('hide');
    found.classList.add('show');
  });
  marker.addEventListener('markerLost', () => {
    hint.classList.remove('hide');
    found.classList.remove('show');
  });
</script>

</body>
</html>
